[project]
name = "callwise"
version = "0.1.0"
description = "Multi-tenant Voice AI Receptionist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.2.0",
    "sentence-transformers>=3.0.0",
    "livekit-agents>=1.8.0",
    "livekit-plugins-deepgram>=1.8.0",
    "livekit-plugins-cartesia>=1.8.0",
    "livekit-plugins-silero>=1.8.0",
    "livekit-plugins-groq>=1.8.0",
    "livekit-plugins-google>=1.8.0",
    "livekit-plugins-openai>=1.8.0",
    "groq>=0.11.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
    "tenacity>=8.3.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
callwise = "callwise.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callwise"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
