services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: callwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: callwise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d callwise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
