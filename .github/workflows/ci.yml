name: Callwise CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Test Suite & Diagnostics
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: callwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv sync --all-extras

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/callwise
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/callwise
        run: |
          uv run alembic upgrade head

      - name: Run Callwise Doctor Diagnostic
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/callwise
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/callwise
        run: |
          uv run python -m callwise.cli doctor

      - name: Execute Full Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/callwise
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/callwise
          SECRET_KEY: test-ci-secret-key-min-32-chars-long!
          LIVEKIT_URL: wss://callwise-ci.livekit.cloud
          LIVEKIT_API_KEY: devkey_ci_test
          LIVEKIT_API_SECRET: secret_ci_test_key_32_chars_long!
          DEEPGRAM_API_KEY: mock_deepgram_ci_token
          LLM_PROVIDER: groq
          GROQ_API_KEY: gsk_mock_ci_token
          NO_COLOR: "1"
          TERM: "dumb"
        run: |
          uv run python -m pytest tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: |
          npm ci || npm install

      - name: Build Next.js Production App
        working-directory: ./web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build
