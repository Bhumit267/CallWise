<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <style>
      .font-sans {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="1280" height="320" fill="#F4F4F0" />

  <!-- Hard shadow for main canvas card -->
  <rect x="24" y="24" width="1232" height="272" rx="12" fill="#000000" />

  <!-- Main container card -->
  <rect x="16" y="16" width="1232" height="272" rx="12" fill="#FAFAF8" stroke="#000000" stroke-width="4" />

  <!-- Left decorative neo-brutalist pattern / accent stripe -->
  <path d="M16 28 C16 21.37 21.37 16 28 16 L48 16 L48 288 L28 288 C21.37 288 16 282.63 16 276 Z" fill="#FDE047" stroke="#000000" stroke-width="4" />

  <!-- Category badge pill (Yellow) -->
  <g transform="translate(80, 52)">
    <rect x="4" y="4" width="310" height="36" rx="6" fill="#000000" />
    <rect x="0" y="0" width="310" height="36" rx="6" fill="#FEF08A" stroke="#000000" stroke-width="3" />
    <text x="16" y="24" class="font-sans" font-size="13" font-weight="800" fill="#000000" letter-spacing="1.5">
      MULTI-TENANT VOICE RECEPTIONIST
    </text>
  </g>

  <!-- Main Brand Title -->
  <text x="80" y="145" class="font-sans" font-size="62" font-weight="900" fill="#000000" letter-spacing="-1">
    CALLWISE
  </text>

  <!-- Secondary Title Accent Dot -->
  <circle cx="430" cy="138" r="8" fill="#3B82F6" stroke="#000000" stroke-width="3" />

  <!-- Hook Tagline -->
  <text x="82" y="185" class="font-sans" font-size="20" font-weight="600" fill="#27272A">
    A clinic that never misses a call. Grounded voice booking, real-time telephony, and multi-tenant routing.
  </text>

  <!-- Tech Stack Neo-Brutalist Badges -->
  <!-- Badge 1: LiveKit WebRTC / SIP -->
  <g transform="translate(80, 222)">
    <rect x="3" y="3" width="175" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="175" height="34" rx="6" fill="#93C5FD" stroke="#000000" stroke-width="2.5" />
    <text x="14" y="22" class="font-sans" font-size="13" font-weight="700" fill="#000000">
      ⚡ LiveKit WebRTC + SIP
    </text>
  </g>

  <!-- Badge 2: FastAPI + Next.js -->
  <g transform="translate(270, 222)">
    <rect x="3" y="3" width="175" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="175" height="34" rx="6" fill="#A7F3D0" stroke="#000000" stroke-width="2.5" />
    <text x="14" y="22" class="font-sans" font-size="13" font-weight="700" fill="#000000">
      🚀 FastAPI + Next.js 14
    </text>
  </g>

  <!-- Badge 3: PostgreSQL + pgvector -->
  <g transform="translate(460, 222)">
    <rect x="3" y="3" width="185" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="185" height="34" rx="6" fill="#FED7AA" stroke="#000000" stroke-width="2.5" />
    <text x="14" y="22" class="font-sans" font-size="13" font-weight="700" fill="#000000">
      🐘 PostgreSQL + pgvector
    </text>
  </g>

  <!-- Badge 4: Deepgram + Groq -->
  <g transform="translate(660, 222)">
    <rect x="3" y="3" width="155" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="155" height="34" rx="6" fill="#E9D5FF" stroke="#000000" stroke-width="2.5" />
    <text x="14" y="22" class="font-sans" font-size="13" font-weight="700" fill="#000000">
      🎙️ Deepgram + Groq
    </text>
  </g>

  <!-- Right Decorative Phone Widget / Neo-brutalist Graphic Card -->
  <g transform="translate(980, 52)">
    <rect x="6" y="6" width="220" height="204" rx="10" fill="#000000" />
    <rect x="0" y="0" width="220" height="204" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" />

    <!-- Card Header -->
    <rect x="0" y="0" width="220" height="38" rx="8" fill="#FDE047" stroke="#000000" stroke-width="3.5" />
    <circle cx="18" cy="19" r="5" fill="#EF4444" stroke="#000000" stroke-width="1.5" />
    <circle cx="34" cy="19" r="5" fill="#F59E0B" stroke="#000000" stroke-width="1.5" />
    <circle cx="50" cy="19" r="5" fill="#10B981" stroke="#000000" stroke-width="1.5" />
    <text x="80" y="24" class="font-sans" font-size="11" font-weight="800" fill="#000000" letter-spacing="1">LIVE INBOUND</text>

    <!-- Card Content Lines -->
    <rect x="18" y="58" width="130" height="14" rx="3" fill="#000000" />
    <rect x="18" y="80" width="184" height="10" rx="2" fill="#E4E4E7" />
    <rect x="18" y="98" width="160" height="10" rx="2" fill="#E4E4E7" />

    <!-- Status pill inside graphic -->
    <rect x="18" y="125" width="184" height="42" rx="6" fill="#F4F4F5" stroke="#000000" stroke-width="2" />
    <circle cx="34" cy="146" r="5" fill="#10B981" />
    <text x="46" y="143" class="font-sans" font-size="11" font-weight="800" fill="#000000">Call Connected</text>
    <text x="46" y="157" class="font-sans" font-size="10" font-weight="600" fill="#71717A">12:00 PM Slot Booked</text>

    <text x="18" y="190" class="font-sans" font-size="10" font-weight="700" fill="#A1A1AA">BK-TSZ • ₹4,500</text>
  </g>
</svg>
